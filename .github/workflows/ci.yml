name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      RUBY_VERSION: 3.4.9
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.RUBY_VERSION }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.RUBY_VERSION }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    # A9: the committed Gemfile.lock tracks the gemspec's declared Rails floor
    # (>= 8.1), so this job runs the suite against the claimed minimum — the
    # floor is proven, not just asserted. (8.0 was ruled out: the management UI's
    # params.expect array handling needs 8.1.)

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.9
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        # The engine's bin/rails (rails/engine/commands) runs one command per
        # invocation — `db:test:prepare test` in one call fails on `test`. Split.
        # System tests render the mounted UI in headless Chrome (preinstalled on
        # the runner; cuprite drives it over CDP, --no-sandbox set in the driver)
        # so template errors and layout regressions fail CI, not just unit gaps.
        # Coverage (#114): distinct SIMPLECOV_COMMAND_NAME so unit+system merge.
        # bash -e short-circuits if unit fails — system is skipped and the
        # coverage artifact (uploaded always()) is unit-only. Intentional:
        # fix the red unit suite before spending runner time on system.
        run: |
          bin/rails db:test:prepare
          SIMPLECOV_COMMAND_NAME=unit bin/rails test
          SIMPLECOV_COMMAND_NAME=system bin/rails test:system

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      # The migrate skill's classifier and call-site rewriter are both
      # security-relevant (a wrong pure_role, or a wrongly deleted authorize,
      # silently changes who can do what) — their self-tests and all template
      # syntax run in CI so regressions go red here, not in a host app
      # mid-migration.
      - name: Migrate-skill checks (self-tests + template syntax)
        run: |
          ruby .claude/skills/current-scope-migrate/scripts/policy_inventory.rb --self-test
          ruby .claude/skills/current-scope-migrate/scripts/ability_inventory.rb --self-test
          ruby .claude/skills/current-scope-migrate/scripts/callsite_rewrite.rb --self-test
          ruby -c .claude/skills/current-scope-migrate/templates/current_scope_migrate.rake.tt
          ruby -c .claude/skills/current-scope-migrate/templates/backfill_enum_roles.rb.tt
          ruby -c .claude/skills/current-scope-migrate/templates/backfill_rolify.rb.tt

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # #151 widened the polymorphic grant id columns to string so a UUID primary key
  # survives. Adapters disagree about comparing a string column to an integer one:
  # SQLite coerces silently, MySQL coerces, PostgreSQL raises outright. The
  # SQLite-only job above cannot see that class of bug — it is exactly how the UUID
  # collision reached three releases — so the same suite runs on both server
  # databases. `bin/db test` runs these locally against Docker.
  adapters:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: postgres
            url: postgresql://cs:cs@127.0.0.1:5432/cs_test
          - adapter: mysql
            url: trilogy://root:cs@127.0.0.1:3306/cs_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cs
          POSTGRES_PASSWORD: cs
          POSTGRES_DB: cs_test
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U cs" --health-interval 5s
          --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: cs
          MYSQL_DATABASE: cs_test
        ports: [ "3306:3306" ]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pcs" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.9
          bundler-cache: true

      # Unit only: the system suite needs headless Chrome and adds nothing about
      # column types, which is what this job exists to check. COVERAGE=0 because
      # the SQLite job owns the coverage artifact.
      - name: Run the suite on ${{ matrix.adapter }}
        env:
          RAILS_ENV: test
          DATABASE_URL: ${{ matrix.url }}
          COVERAGE: "0"
        # schema.rb cannot express MySQL's collation, so a freshly-loaded schema has
        # the right column type and the wrong collation. Apply the engine migration
        # on top — the schema a host actually ends up with (#151).
        run: |
          bin/rails db:test:prepare
          bin/rails runner 'require File.expand_path("db/migrate/20260805000001_widen_current_scope_polymorphic_ids.rb", Dir.pwd); m = WidenCurrentScopePolymorphicIds.new; m.verbose = false; m.migrate(:up)'
          bin/rails test
