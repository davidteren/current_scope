name: docs-site

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/guides/**"
      - "docs/SECURITY-CHECKLIST.md"
      - "README.md"
      - "UPGRADING.md"
      - "bin/docs-site"
      - ".github/workflows/pages.yml"
  # PRs get the build (never the deploy) so a broken site fails the PR,
  # not the post-merge deploy.
  pull_request:
    paths:
      - "docs/site/**"
      - "docs/guides/**"
      - "docs/SECURITY-CHECKLIST.md"
      - "README.md"
      - "UPGRADING.md"
      - "bin/docs-site"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege: PR builds get read-only; only the deploy job (main-gated)
# mints an OIDC token and writes to Pages.
permissions:
  contents: read

# Cancel superseded PR builds, but let production deploys finish and queue
# (GitHub's Pages template: never cancel an in-progress deployment).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      # One catalog (docs/site/_data/doc_tree.yml) generates the security
      # checklist, the docs/guides/ pages, and llms.txt so nav / sitemap /
      # machine indexes cannot drift. Generated Markdown is gitignored.
      - name: Prepare generated docs pages
        run: ruby bin/docs-site prepare
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs/site
          destination: ./_site
      # github-pages will not load a custom Jekyll plugin, so Markdown twins,
      # llms-full.txt, and sitemap extras are written into the built tree.
      - name: Publish Markdown twins and llms-full.txt
        run: ruby bin/docs-site publish _site
      - uses: actions/upload-pages-artifact@v5

  deploy:
    # Deploys come only from main (push or dispatch); PR runs and dispatches
    # from other branches stop after the build job.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
