<!--
  The way back out of the docs.

  The sidebar lists the guides and nothing else, so a reader who landed on
  Quickstart from a search engine has no route to the two pages that answer
  "should I use this at all?" — the overview and the fit comparison. Both live
  outside the theme's nav, so they are named here explicitly.
-->
<div class="cs-site-links">
  <a href="{{ '/' | relative_url }}">Overview</a>
  <a href="{{ '/comparison.html' | relative_url }}">Is it the right fit?</a>
  <a href="https://github.com/davidteren/current_scope">GitHub</a>
  <!-- Unhidden by head_custom.html once the click handler is wired, so it can
       never render as a control that does nothing. -->
  <button type="button" class="cs-theme-toggle" data-cs-theme-toggle hidden>Switch theme</button>
</div>
