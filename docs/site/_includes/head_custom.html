<!--
  Carry the visitor's theme across the seam between the marketing page and the
  docs.

  index.html lets a visitor choose light or dark and stores the choice in
  localStorage['cs-theme']; without a stored choice it follows the OS. The
  just-the-docs theme knows nothing about either, so before this include a
  visitor could pick light on the landing page, click "Docs", and land in dark.
  A preference the interface forgets one click after it was given is worse than
  never offering it.

  Applied in <head>, before first paint, so the docs never flash the wrong
  theme. jtd.setTheme is defined later by the theme's own script, so the class
  is set directly here and reconciled once the theme's JS is available.
-->
<script>
  (function () {
    var stored = null;
    try { stored = localStorage.getItem("cs-theme"); } catch (e) {}

    var theme = stored === "light" || stored === "dark" ? stored : null;
    if (!theme && window.matchMedia) {
      theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    if (!theme) return;

    var html = document.documentElement;
    html.classList.remove("color-scheme-dark", "color-scheme-light");
    html.classList.add("color-scheme-" + theme);
    html.setAttribute("data-cs-theme", theme);

    // The theme's own bootstrap runs later and reads jtd.getTheme(); tell it
    // what we chose once it exists, and wire the toggle the header renders.
    document.addEventListener("DOMContentLoaded", function () {
      if (window.jtd && typeof window.jtd.setTheme === "function") {
        window.jtd.setTheme(theme);
      }

      var toggle = document.querySelector("[data-cs-theme-toggle]");
      if (!toggle) return;

      var apply = function (next) {
        theme = next;
        html.setAttribute("data-cs-theme", next);
        if (window.jtd && typeof window.jtd.setTheme === "function") {
          window.jtd.setTheme(next);
        } else {
          html.classList.remove("color-scheme-dark", "color-scheme-light");
          html.classList.add("color-scheme-" + next);
        }
        toggle.setAttribute("aria-pressed", String(next === "dark"));
        try { localStorage.setItem("cs-theme", next); } catch (e) {}
      };

      toggle.setAttribute("aria-pressed", String(theme === "dark"));
      toggle.addEventListener("click", function () {
        apply(theme === "dark" ? "light" : "dark");
      });
    });
  })();
</script>

<style>
  /* Three tokens carried over from the landing page, so the docs read as the
     same product: the accent, the top of the type scale, and the pill. Not a
     theme rewrite — just the parts a reader notices in the first second. */
  :root {
    --cs-accent: #2f5bff;
    --cs-accent-soft: rgba(47, 91, 255, .12);
  }

  html.color-scheme-dark {
    --cs-accent: #7f9bff;
    --cs-accent-soft: rgba(127, 155, 255, .16);
  }

  .site-title.lh-tight {
    font-weight: 700;
    letter-spacing: -.02em;
  }

  /* The way back. A reader who arrived on Quickstart from a search engine has
     no route to "should I use this at all?" without this. */
  .cs-site-links {
    display: flex;
    flex-wrap: wrap;
    gap: .35rem .75rem;
    padding: .35rem 1rem .75rem;
    font-size: .75rem;
    line-height: 1.4;
  }

  .cs-site-links a { text-decoration: none; }
  .cs-site-links a:hover { text-decoration: underline; }

  .cs-theme-toggle {
    font: inherit;
    font-size: .75rem;
    background: none;
    border: 1px solid currentColor;
    border-radius: 100px;
    padding: .1rem .55rem;
    cursor: pointer;
    color: inherit;
    opacity: .8;
  }

  .cs-theme-toggle:hover { opacity: 1; }
  .cs-theme-toggle:focus-visible { outline: 2px solid var(--cs-accent); outline-offset: 2px; }

  /* The copy button the theme now renders sits tight against the code; give it
     the same breathing room the landing page's copy button has. */
  .code-example + .highlighter-rouge .copy-button,
  .highlighter-rouge .copy-button { margin: .35rem; }
</style>
